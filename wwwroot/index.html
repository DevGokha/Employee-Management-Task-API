<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Management Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        body { background-color: #f8f9fa; }
        .navbar-brand { font-weight: 700; }
        .card { border-radius: 10px; border: none; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .table-hover tbody tr:hover { background-color: #f1f3f5; }
        .badge-active { background-color: #198754; }
        .badge-inactive { background-color: #dc3545; }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
        <div class="container">
            <a class="navbar-brand" href="#"><i class="bi bi-people-fill me-2"></i>Employee Management & Task API</a>
            <div class="d-flex align-items-center" id="navAuthSection">
                <span class="text-light me-3 d-none" id="userBadge"><i class="bi bi-person-circle me-1"></i><span id="usernameDisplay">User</span></span>
                <button class="btn btn-outline-light btn-sm" id="btnLoginModal" data-bs-toggle="modal" data-bs-target="#loginModal"><i class="bi bi-box-arrow-in-right me-1"></i>Login</button>
                <button class="btn btn-outline-danger btn-sm d-none" id="btnLogout"><i class="bi bi-box-arrow-right me-1"></i>Logout</button>
            </div>
        </div>
    </nav>

    <div class="container">
        <!-- Status Notification Alert -->
        <div id="alertContainer"></div>

        <!-- Filter & Actions Bar -->
        <div class="card mb-4 p-3">
            <div class="row g-3 align-items-center">
                <div class="col-md-3">
                    <label class="form-label small fw-bold text-muted mb-1">Department Filter</label>
                    <select class="form-select form-select-sm" id="filterDepartment">
                        <option value="">All Departments</option>
                        <option value="IT">IT</option>
                        <option value="HR">HR</option>
                        <option value="Sales">Sales</option>
                        <option value="Admin">Admin</option>
                    </select>
                </div>
                <div class="col-md-3">
                    <label class="form-label small fw-bold text-muted mb-1">Status Filter</label>
                    <select class="form-select form-select-sm" id="filterStatus">
                        <option value="">All Statuses</option>
                        <option value="true">Active Only</option>
                        <option value="false">Inactive Only</option>
                    </select>
                </div>
                <div class="col-md-3">
                    <label class="form-label small fw-bold text-muted mb-1">Sort By</label>
                    <select class="form-select form-select-sm" id="filterSort">
                        <option value="">Default (ID Desc)</option>
                        <option value="salary_desc">Salary (High to Low)</option>
                        <option value="salary_asc">Salary (Low to High)</option>
                        <option value="name">Name (A-Z)</option>
                    </select>
                </div>
                <div class="col-md-3 text-end pt-3">
                    <button class="btn btn-primary btn-sm me-1" id="btnRefresh"><i class="bi bi-arrow-clockwise me-1"></i>Refresh</button>
                    <button class="btn btn-success btn-sm" id="btnAddEmployee" data-bs-toggle="modal" data-bs-target="#employeeModal"><i class="bi bi-plus-lg me-1"></i>Add Employee</button>
                </div>
            </div>
        </div>

        <!-- Employee List Table -->
        <div class="card">
            <div class="card-header bg-white py-3 d-flex justify-content-between align-items-center">
                <h5 class="card-title mb-0 fw-bold text-dark"><i class="bi bi-table me-2"></i>Employee Directory</h5>
                <a href="/swagger" target="_blank" class="btn btn-outline-secondary btn-sm"><i class="bi bi-code-slash me-1"></i>Swagger OpenAPI</a>
            </div>
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-hover align-middle mb-0">
                        <thead class="table-light">
                            <tr>
                                <th>ID</th>
                                <th>Name</th>
                                <th>Email</th>
                                <th>Department</th>
                                <th>Role</th>
                                <th>Salary</th>
                                <th>Status</th>
                                <th class="text-end">Actions</th>
                            </tr>
                        </thead>
                        <tbody id="employeeTableBody">
                            <tr>
                                <td colspan="8" class="text-center py-4 text-muted">
                                    <div class="spinner-border spinner-border-sm text-primary me-2" role="status"></div>Loading employee records...
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- Login Modal -->
    <div class="modal fade" id="loginModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title fw-bold"><i class="bi bi-shield-lock me-2"></i>JWT Authentication Login</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div class="alert alert-info py-2 small">
                        <strong>Demo Accounts:</strong><br>
                        Username: <code>admin</code> | Password: <code>AdminPassword123!</code><br>
                        Username: <code>dev</code> | Password: <code>DevPassword123!</code>
                    </div>
                    <form id="loginForm">
                        <div class="mb-3">
                            <label class="form-label">Username</label>
                            <input type="text" class="form-control" id="loginUsername" value="admin" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Password</label>
                            <input type="password" class="form-control" id="loginPassword" value="AdminPassword123!" required>
                        </div>
                        <button type="submit" class="btn btn-primary w-100">Login & Get JWT Token</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- Employee Create/Edit Modal -->
    <div class="modal fade" id="employeeModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title fw-bold" id="employeeModalTitle">Add New Employee</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="employeeForm">
                        <input type="hidden" id="empId">
                        <div class="mb-3">
                            <label class="form-label">Full Name</label>
                            <input type="text" class="form-control" id="empName" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Email Address</label>
                            <input type="email" class="form-control" id="empEmail" required>
                        </div>
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Department</label>
                                <input type="text" class="form-control" id="empDepartment" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Role</label>
                                <input type="text" class="form-control" id="empRole" required>
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Salary ($)</label>
                                <input type="number" class="form-control" id="empSalary" step="0.01" required>
                            </div>
                            <div class="col-md-6 mb-3 d-flex align-items-end">
                                <div class="form-check">
                                    <input class="form-check-input" type="checkbox" id="empIsActive" checked>
                                    <label class="form-check-label" for="empIsActive">Active Employee</label>
                                </div>
                            </div>
                        </div>
                        <button type="submit" class="btn btn-success w-100" id="btnSaveEmployee">Save Employee</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const API_URL = '/api';
        let jwtToken = localStorage.getItem('jwtToken') || '';
        let username = localStorage.getItem('username') || '';

        document.addEventListener('DOMContentLoaded', () => {
            updateAuthUI();
            loadEmployees();

            document.getElementById('filterDepartment').addEventListener('change', loadEmployees);
            document.getElementById('filterStatus').addEventListener('change', loadEmployees);
            document.getElementById('filterSort').addEventListener('change', loadEmployees);
            document.getElementById('btnRefresh').addEventListener('click', loadEmployees);

            document.getElementById('loginForm').addEventListener('submit', handleLogin);
            document.getElementById('btnLogout').addEventListener('click', handleLogout);
            document.getElementById('employeeForm').addEventListener('submit', handleSaveEmployee);
            document.getElementById('btnAddEmployee').addEventListener('click', resetEmployeeForm);
        });

        function updateAuthUI() {
            const userBadge = document.getElementById('userBadge');
            const usernameDisplay = document.getElementById('usernameDisplay');
            const btnLoginModal = document.getElementById('btnLoginModal');
            const btnLogout = document.getElementById('btnLogout');

            if (jwtToken) {
                userBadge.classList.remove('d-none');
                usernameDisplay.textContent = username || 'Authenticated User';
                btnLoginModal.classList.add('d-none');
                btnLogout.classList.remove('d-none');
            } else {
                userBadge.classList.add('d-none');
                btnLoginModal.classList.remove('d-none');
                btnLogout.classList.add('d-none');
            }
        }

        async function handleLogin(e) {
            e.preventDefault();
            const u = document.getElementById('loginUsername').value;
            const p = document.getElementById('loginPassword').value;

            try {
                const res = await fetch(`${API_URL}/auth/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: u, password: p })
                });

                if (!res.ok) {
                    throw new Error('Invalid username or password');
                }

                const data = await res.json();
                jwtToken = data.token;
                username = data.username;
                localStorage.setItem('jwtToken', jwtToken);
                localStorage.setItem('username', username);

                updateAuthUI();
                bootstrap.Modal.getInstance(document.getElementById('loginModal')).hide();
                showAlert('Successfully authenticated! JWT token saved.', 'success');
                loadEmployees();
            } catch (err) {
                showAlert(err.message, 'danger');
            }
        }

        function handleLogout() {
            jwtToken = '';
            username = '';
            localStorage.removeItem('jwtToken');
            localStorage.removeItem('username');
            updateAuthUI();
            showAlert('Logged out successfully.', 'info');
            loadEmployees();
        }

        async function loadEmployees() {
            const tbody = document.getElementById('employeeTableBody');
            tbody.innerHTML = `<tr><td colspan="8" class="text-center py-4 text-muted"><div class="spinner-border spinner-border-sm text-primary me-2"></div>Loading employees...</td></tr>`;

            const dept = document.getElementById('filterDepartment').value;
            const active = document.getElementById('filterStatus').value;
            const sort = document.getElementById('filterSort').value;

            let url = `${API_URL}/employees?`;
            if (dept) url += `department=${encodeURIComponent(dept)}&`;
            if (active) url += `active=${active}&`;
            if (sort) url += `sortBy=${encodeURIComponent(sort)}&`;

            const headers = {};
            if (jwtToken) {
                headers['Authorization'] = `Bearer ${jwtToken}`;
            }

            try {
                const res = await fetch(url, { headers });

                if (res.status === 401) {
                    tbody.innerHTML = `<tr><td colspan="8" class="text-center py-4 text-danger"><i class="bi bi-shield-lock me-2"></i>401 Unauthorized: Please login to view protected employee records.</td></tr>`;
                    return;
                }

                if (!res.ok) {
                    throw new Error(`Error fetching employees (Status: ${res.status})`);
                }

                const employees = await res.json();

                if (employees.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="8" class="text-center py-4 text-muted">No employee records found.</td></tr>`;
                    return;
                }

                tbody.innerHTML = employees.map(emp => `
                    <tr>
                        <td class="fw-bold">${emp.id}</td>
                        <td>${escapeHtml(emp.name)}</td>
                        <td>${escapeHtml(emp.email)}</td>
                        <td><span class="badge bg-secondary">${escapeHtml(emp.department)}</span></td>
                        <td>${escapeHtml(emp.role)}</td>
                        <td class="fw-semibold">$${emp.salary.toLocaleString('en-US', { minimumFractionDigits: 2 })}</td>
                        <td><span class="badge ${emp.isActive ? 'badge-active' : 'badge-inactive'}">${emp.isActive ? 'Active' : 'Inactive'}</span></td>
                        <td class="text-end">
                            <button class="btn btn-sm btn-outline-primary me-1" onclick="editEmployee(${emp.id})"><i class="bi bi-pencil"></i></button>
                            <button class="btn btn-sm btn-outline-danger" onclick="deleteEmployee(${emp.id})"><i class="bi bi-trash"></i></button>
                        </td>
                    </tr>
                `).join('');
            } catch (err) {
                tbody.innerHTML = `<tr><td colspan="8" class="text-center py-4 text-danger">${err.message}</td></tr>`;
            }
        }

        function resetEmployeeForm() {
            document.getElementById('employeeModalTitle').textContent = 'Add New Employee';
            document.getElementById('empId').value = '';
            document.getElementById('empName').value = '';
            document.getElementById('empEmail').value = '';
            document.getElementById('empDepartment').value = 'IT';
            document.getElementById('empRole').value = 'Developer';
            document.getElementById('empSalary').value = '60000';
            document.getElementById('empIsActive').checked = true;
        }

        async function editEmployee(id) {
            try {
                const res = await fetch(`${API_URL}/employees/${id}`, {
                    headers: { 'Authorization': `Bearer ${jwtToken}` }
                });

                if (!res.ok) throw new Error('Failed to load employee details');
                const emp = await res.json();

                document.getElementById('employeeModalTitle').textContent = `Edit Employee #${emp.id}`;
                document.getElementById('empId').value = emp.id;
                document.getElementById('empName').value = emp.name;
                document.getElementById('empEmail').value = emp.email;
                document.getElementById('empDepartment').value = emp.department;
                document.getElementById('empRole').value = emp.role;
                document.getElementById('empSalary').value = emp.salary;
                document.getElementById('empIsActive').checked = emp.isActive;

                new bootstrap.Modal(document.getElementById('employeeModal')).show();
            } catch (err) {
                showAlert(err.message, 'danger');
            }
        }

        async function handleSaveEmployee(e) {
            e.preventDefault();
            const id = document.getElementById('empId').value;
            const dto = {
                name: document.getElementById('empName').value,
                email: document.getElementById('empEmail').value,
                department: document.getElementById('empDepartment').value,
                role: document.getElementById('empRole').value,
                salary: parseFloat(document.getElementById('empSalary').value),
                isActive: document.getElementById('empIsActive').checked
            };

            const isEdit = !!id;
            const url = isEdit ? `${API_URL}/employees/${id}` : `${API_URL}/employees`;
            const method = isEdit ? 'PUT' : 'POST';

            try {
                const res = await fetch(url, {
                    method: method,
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${jwtToken}`
                    },
                    body: JSON.stringify(dto)
                });

                if (res.status === 401) throw new Error('401 Unauthorized: Login required to modify employees.');
                if (!res.ok) throw new Error(`Operation failed with status ${res.status}`);

                bootstrap.Modal.getInstance(document.getElementById('employeeModal')).hide();
                showAlert(`Employee ${isEdit ? 'updated' : 'created'} successfully!`, 'success');
                loadEmployees();
            } catch (err) {
                showAlert(err.message, 'danger');
            }
        }

        async function deleteEmployee(id) {
            if (!confirm(`Are you sure you want to delete employee #${id}?`)) return;

            try {
                const res = await fetch(`${API_URL}/employees/${id}`, {
                    method: 'DELETE',
                    headers: { 'Authorization': `Bearer ${jwtToken}` }
                });

                if (res.status === 401) throw new Error('401 Unauthorized: Login required to delete employees.');
                if (!res.ok) throw new Error(`Delete failed with status ${res.status}`);

                showAlert(`Employee #${id} deleted successfully.`, 'warning');
                loadEmployees();
            } catch (err) {
                showAlert(err.message, 'danger');
            }
        }

        function showAlert(msg, type) {
            const container = document.getElementById('alertContainer');
            container.innerHTML = `
                <div class="alert alert-${type} alert-dismissible fade show" role="alert">
                    ${msg}
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>
            `;
        }

        function escapeHtml(str) {
            return str.replace(/[&<>'"]/g, 
                tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
            );
        }
    </script>
</body>
</html>
